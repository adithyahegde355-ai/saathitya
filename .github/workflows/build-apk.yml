name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Check the app script
        run: npm run check

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sahitya.apk

      - name: Keep a copy with the build
        uses: actions/upload-artifact@v4
        with:
          name: Sahitya-apk
          path: Sahitya.apk
          if-no-files-found: error

      - name: Publish a direct download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Sahitya APK (build ${{ github.run_number }})
          body: Download Sahitya.apk below and install it on your Android phone.
          files: Sahitya.apk
          make_latest: true
